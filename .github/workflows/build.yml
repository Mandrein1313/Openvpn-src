name: Android Cloud Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Remove old BuildConfig.java
      run: |
        find . -path "*/src/main/java/*/BuildConfig.java" -delete

    - name: Setup AndroidX
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    - name: Clean & Build Debug APK
      run: |
        gradle clean assembleDebug --no-daemon --build-cache

    # ==========================================
    # ส่วนที่เพิ่มเข้ามา: รัน Emulator และดัก Logcat ตอน Crash
    # ==========================================
    - name: Run App on Emulator & Capture Crash Logs
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        target: google_apis
        arch: x86_64
        script: |
          echo "📲 Installing APK onto Emulator..."
          # ค้นหาไฟล์ debug APK ที่สร้างได้แล้วสั่งติดตั้ง
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          adb install "$APK_PATH"
          
          echo "🧹 Clearing old logcat..."
          adb logcat -c
          
          echo "🚀 Launching OpenVPN Client App..."
          # สั่งเปิดหน้า Main Activity
          adb shell am start -n net.openvpn.openvpn/net.openvpn.openvpn.OpenVPNClient
          
          echo "⏳ Waiting for app response (10s)..."
          sleep 10
          
          echo "=========================================="
          echo "🔥 CRASH / FATAL ERROR LOGS FROM EMULATOR 🔥"
          echo "=========================================="
          # ดึงเฉพาะ log สัญญาณระดับ Error / Exception ขึ้นมาโชว์
          adb logcat -d *:E | grep -E "AndroidRuntime|FATAL|Exception|Caused by" || echo "No crash detected during execution!"
          echo "=========================================="

    # ==========================================
    # ส่วนเดิม: สร้าง Release Upload APK
    # ==========================================
    - name: Generate Timestamp
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "build-${{ steps.timestamp.outputs.timestamp }}"
        name: "Build ${{ steps.timestamp.outputs.timestamp }}"
        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: true
        files: "**/build/outputs/apk/**/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
