name: 🩺 Android Crash Analysis

run-name: 🔍 Crash Test - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-crash:
    name: 🧪 Run Emulator & Capture Crash Logs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Remove old BuildConfig.java
      run: |
        find . -path "*/src/main/java/*/BuildConfig.java" -delete

    - name: Setup AndroidX
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon --build-cache

    - name: Run App on Emulator & Capture Crash Logs
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        disable-animations: true
        script: >
          APK=$(find . -name "*.apk" | head -n 1);
          echo "Found APK = $APK";
          PKG=$($ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK" | grep package | awk -F"'" '{print $2}');
          echo "Detected Package Name = $PKG";
          adb install "$APK";
          adb logcat -c;
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1;
          sleep 12;
          echo "==========================================";
          echo "ALL ERROR LOGS FOR THIS APP";
          echo "==========================================";
          adb logcat -d *:E | grep -i "$PKG" || adb logcat -d *:E | grep -E "AndroidRuntime|FATAL|Exception|Caused by" || echo "No crash detected"
