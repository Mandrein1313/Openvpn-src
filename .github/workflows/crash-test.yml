name: 🩺 Android Crash Analysis

run-name: 🔍 Crash Test - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-crash:
    name: 🧪 Run Emulator & Catch Logcat
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Remove old BuildConfig.java
      run: |
        find . -path "*/src/main/java/*/BuildConfig.java" -delete

    - name: Setup AndroidX
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon --build-cache

    - name: Run App on Emulator & Capture Crash Logs
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        target: google_apis
        arch: x86_64
        script: >
          APK=$(find . -name "*.apk" | head -n 1);
          echo "Found APK = $APK";
          adb install "$APK";
          adb logcat -c;
          adb shell am start -n net.openvpn.openvpn/net.openvpn.openvpn.OpenVPNClient;
          sleep 10;
          echo "==========================================";
          echo "CRASH / FATAL ERROR LOGS FROM EMULATOR";
          echo "==========================================";
          adb logcat -d *:E | grep -E "AndroidRuntime|FATAL|Exception|Caused by" || echo "No crash detected"
